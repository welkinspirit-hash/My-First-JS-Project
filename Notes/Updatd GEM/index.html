<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Order Form</h1>

    <form id="orderForm">
        <!-- Customer Name -->
        <div>
            <label for="name">Customer Name:</label>
            <input type="text" id="name" name="customerName" placeholder="Enter customer name" required>
        </div>

        <!-- Product Name -->
        <div>
            <label for="product">Product Name:</label>
            <input type="text" id="product" name="productName" placeholder="Enter product name" required>
        </div>

        <!-- Quantity -->
        <div>
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" placeholder="Quantity" min="1" required>
        </div>

        <!-- Unit Price -->
        <div>
            <label for="unitPrice">Unit Price:</label>
            <input type="number" id="unitPrice" name="unitPrice" placeholder="Unit Price" step="0.01" min="0" required>
        </div>

        <!-- Member Status -->
        <div>
            <label for="status">Member Status:</label>
            <select id="status" name="status">
                <option value="member">Member (10% Discount)</option>
                <option value="non-member">Non-Member</option>
            </select>
        </div>

        <!-- Delivery Type -->
        <div>
            <label for="delivery">Delivery Type:</label>
            <select id="delivery" name="delivery">
                <option value="Standard">Standard Delivery</option>
                <option value="Express">Express Delivery</option>
            </select>
        </div>

        <!-- Status Filter for Section 6 -->
        <div style="margin-top: 15px;">
            <label for="statusFilter">Filter Orders by Status:</label>
            <select id="statusFilter">
                <option value="All">All</option>
                <option value="Pending">Pending</option>
                <option value="Ready">Ready</option>
            </select>
        </div>

        <button type="submit">Book / Submit Order</button>
    </form>

    <!-- Clearly identified area for JavaScript messages and order results -->
    <div id="output"></div>

    <script src="script.js"></script>
</body>
</html>
