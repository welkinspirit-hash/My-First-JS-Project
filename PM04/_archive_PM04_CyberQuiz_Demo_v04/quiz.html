<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

    <body>
        <div class="quiz-container">

<!-- Progress -->
        <h2 id="questionNumber">

            Question 1 of 5

        </h2>

<!-- Question Card -->
        <div class="question-card">

            <h3 id="question">

                You receive an email asking you to reset your password. What should you do?

            </h3>

        </div>

<!-- Answer Buttons -->
        <div class="answers">

<!-- Answer buttons 1 -->
            <button id="answer0" class="answer-btn">
                Click the link and reset your password.
            </button>
            
<!-- Answer buttons 2 -->
            <button id="answer1" class="answer-btn">
                Ignore the email and report it as phishing.
            </button>

<!-- Answer buttons 3 -->
            <button id="answer2" class="answer-btn">
                Reply to the email asking for more information.
            </button>

<!-- Answer buttons 4  -->
            <button id="answer3" class="answer-btn">
                Verify the sender's identity before taking any action.
            </button>

            <p id="feedback"></p>

        </div>

    </div>

    <script src="quiz.js"></script>

</body>
</html>
