<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Cyber Security Awareness Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<section id="quizScreen" class="screen">

    <main class="quiz-container">

        <div class="quiz-header">

            <div>

                <p class="small-heading">

                    CYBER SECURITY AWARENESS

                </p>

                <h1>

                    Security Knowledge Check

                </h1>

            </div>

            <div class="quiz-icon">

                🛡️

            </div>

        </div>

        <div class="progress-section">

    <div class="progress-info">

        <span id="questionNumber">
            Question 1 of 5
        </span>

        <span id="progressPercent">
            20%
        </span>

    </div>

    <!-- Progress Bar -->
    <div class="progress-bar">

        <div
            id="progressFill"
            class="progress-fill"
        ></div>

    </div>

</div>

        <div class="question-card">

            <h2 id="question">

                Question goes here

            </h2>

        </div>

        <div class="answers">

            <button id="answer0" class="answer-btn">
                Answer 1
            </button>

            <button id="answer1" class="answer-btn">
                Answer 2
            </button>

            <button id="answer2" class="answer-btn">
                Answer 3
            </button>

            <button id="answer3" class="answer-btn">
                Answer 4
            </button>

        </div>

        <div
            id="feedback"
            class="feedback"
        ></div>

    </main>

</section>

    <script src="script.js"></script>
