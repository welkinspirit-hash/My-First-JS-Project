<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Cyber Security Awareness Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<section id="resultsScreen" class="screen">

    <main class="results-container">

        <div class="results-icon">

            🏆

        </div>

        <p class="small-heading">
            QUIZ COMPLETE
        </p>

        <h1>
            Your Results
        </h1>

        <div class="score-circle">

            <span id="finalScore">

                0 / 5

            </span>

        </div>

        <div class="level-result">

            <p>
                Security Level
            </p>

            <h2 id="level">

                Cyber Cadet

            </h2>

        </div>

        <button
            id="dashboardBtn"
            class="primary-btn"
        >
            Return to Dashboard
        </button>

    </main>

</section>

    <script src="script.js"></script>
