<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Cyber Security Awareness Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<section id="dashboardScreen" class="screen">

    <div class="page-wrapper">

        <header class="dashboard-header">

            <div>

                <p class="small-heading">
                    CYBER SECURITY AWARENESS
                </p>

                <h1 id="welcomeMessage">
                    Welcome
                </h1>

                <p
                    id="departmentMessage"
                    class="department-text"
                >
                    Department
                </p>

                <button id="certificateBtn">

                    View Certificate

                </button>

            </div>

            <div class="shield-icon">

                🛡️

            </div>

        </header>

        <section class="intro-section">

            <div>

                <h2>
                    Security Dashboard
                </h2>

                <p>
                    Track your cyber security awareness progress.
                </p>

            </div>

            <div class="status-badge">

                ● Security Training

            </div>

        </section>

        <!-- Cards -->
        <section class="card-container">

            <!-- Level Card -->

        <div class="card">

    <div class="card-icon level-icon">
        🏆
    </div>

    <div>

        <h3>
            Current Level
        </h3>

        <p id="currentLevel">
            Not Started
        </p>

    </div>

</div>
          
            <!-- Score Card -->
        <div class="card">

    <div class="card-icon score-icon">
        🎯
    </div>

    <div>

        <h3>
            Score
        </h3>

        <p id="scoreDisplay">
            0 / 5
        </p>

    </div>

</div>            
        <!-- Status Card -->
        <div class="card">

    <div class="card-icon status-icon">
        🔐
    </div>

    <div>

        <h3>
            Quiz Status
        </h3>

        <p id="quizStatus">
            Not Started
        </p>

    </div>

</div>
      </section>

        <!-- Start Quiz -->

        <section class="start-section">

            <button
                id="startQuizBtn"
                class="primary-btn"
            >
                Start Phishing Quiz
            </button>

        </section>
    

    </div>

</section>

    <script src="script.js"></script>
