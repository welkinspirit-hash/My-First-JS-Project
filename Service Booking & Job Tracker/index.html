<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Booking & Job Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Service Booking & Job Tracker</h1>

        <!-- Booking Form -->
        <section>
            <h2>New Service Booking</h2>

            <form id="bookingForm">

                <label for="customerName">Customer Name:</label>
                <input type="text" id="customerName">

                <label for="serviceType">Service Type:</label>
                <select id="serviceType">
                    <option value="">Select a service</option>
                    <option value="Computer Repair">Computer Repair</option>
                    <option value="Software Support">Software Support</option>
                    <option value="Network Support">Network Support</option>
                </select>

                <label for="hours">Number of Hours:</label>
                <input type="number" id="hours" min="1" step="0.5">

                <label>
                    <input type="checkbox" id="urgent">
                    Urgent Booking
                </label>

                <button type="submit">Calculate Booking</button>

            </form>

            <div id="message"></div>
            <div id="result"></div>
        </section>


        <!-- Booking Filter -->
        <section>
            <h2>Booking Records</h2>

            <label for="filter">Filter Bookings:</label>

            <select id="filter">
                <option value="All">All</option>
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
                <option value="Computer Repair">Computer Repair</option>
                <option value="Software Support">Software Support</option>
                <option value="Network Support">Network Support</option>
            </select>

            <div id="bookingList"></div>
        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
